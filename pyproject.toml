[project]
name = "imageprocessing-awesome"
version = "0.1.0"
description = "Digital Image Processing in Python: an interactive Jupyter notebook textbook"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ipykernel>=6.31.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=2.3.3",
    "pandoc>=2.4",
    "pillow>=11.3.0",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbclient>=0.10.2",
    "nbconvert>=7.17.1",
    "nbdime>=4.0.4",
    "nbformat>=5.10.4",
    "ruff>=0.16.10",
]
